name: cyberpunk_space_rpg
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bonfire: ^3.7.2
  just_audio: ^0.9.36
  audioplayers: ^6.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/maps/
    - assets/images/maps/tilesets/
    - assets/images/sprites/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/audio/voices/