Name: Echoes of Elysium
Summary: Cyberpunk space RPG built with Flutter and Bonfire

Description: |
  Echoes of Elysium is a top-down cyberpunk space RPG.

  Explore derelict stations, fight UEC and sentinel drones, collect AI
  fragments and talk to the survivors you meet along the way.

  Features:
  • Real-time combat against hostile drones
  • Collectible AI fragments and health pickups
  • NPCs, portals and multiple maps
  • Original music, sound effects and voice lines
  • Fully offline, no tracking

