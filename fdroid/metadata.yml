Name: Echoes of Elysium
Summary: A calm story adventure about AI, nature, and the memory of a lost world.

Description: |
  In the year 2387, AI engineer Dr. Kaela Osei awakens Gaia, the consciousness
  of the planet Elysium, which holds the memories of the Aetherians, an ancient
  people who chose harmony over conquest. When the United Earth Coalition moves
  to erase Gaia's first memory, Kaela sets out to protect it. Explore painted
  woods, cities, and ruins, uncover fragments of the Aetherian past, and enjoy
  a gentle adventure with no game over and an optional Story Mode.

